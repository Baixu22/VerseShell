[workspace]
members = ["."]

[package]
name = "verseshell"
version = "1.0.0"
edition = "2021"
authors = ["VerseShell Contributors"]
description = "Agent-Computer Interface runtime: typed ops, bounded observations, safe local execution"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nervosys/verseshell"
keywords = ["shell", "functional", "typed", "agent", "runtime", "ir"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.75"

[features]
default = ["native"]
real-tokens = []
native = [
    "dep:walkdir",
    "dep:which",
    "dep:crossterm",
    "dep:tokio",
    "dep:reqwest",
    "dep:keyring",
]

[lib]
name = "verseshell"
path = "src/lib.rs"

[[bin]]
name = "ae"
path = "src/main.rs"

[[bin]]
name = "ae-mcp"
path = "src/bin/ae-mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", features = ["clock", "serde"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.21"
mime = "0.3"
lazy_static = "1.4"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
url = "2.5"
urlencoding = "2.1"
flate2 = "1.0"
tar = "0.4"
getrandom = { version = "0.2", features = ["js"] }
dirs = "5.0"
hex = "0.4"
sysinfo = "0.33"
regex = "1.10"
encoding_rs = "0.8"
md5 = "0.7"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = "1.7"
keyring = { version = "2.3", optional = true }

# Native-only dependencies
walkdir = { version = "2", optional = true }
which = { version = "6", optional = true }
crossterm = { version = "0.27", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"

# HTTP client - non-optional for non-wasm targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = [
    "blocking",
    "json",
    "rustls-tls",
    "stream",
], optional = true }

# Unix-only dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "builtin_performance"
harness = false

[[bench]]
name = "parser_performance"
harness = false

[[bench]]
name = "eval_performance"
harness = false

[[bench]]
name = "pipeline_performance"
harness = false

[[bench]]
name = "observation_performance"
harness = false

